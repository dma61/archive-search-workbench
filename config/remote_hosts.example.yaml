# Network-USB (USB/IP) — exporter hosts
# =====================================
# Machines you can attach an archive drive to, to pass it over USB/IP to the app
# host (the importer). The app reads this list for the "Network-USB" panel.
#
# Fields per host:
#   name  : display name in the UI
#   host  : address 'usbip attach -r <host>' uses (IP or hostname / Tailscale name)
#   os    : windows | linux  (decides which exporter instructions the UI shows)
#   notes : free-form description
#
# See network-usb/README.md for setting up the exporter per machine type.
# A typical consumer NAS cannot act as an exporter out of the box (missing usbip
# kernel modules); see network-usb/README.md for a file-level alternative.
#
# This is an EXAMPLE. Copy it to config/remote_hosts.yaml and fill in your own
# machines. config/remote_hosts.yaml is git-ignored (per deployment); if it is
# absent, the app falls back to this example file.

hosts:
  - name: "My desktop"
    host: "192.168.1.50"          # replace with your machine's IP or hostname
    os: windows
    notes: "Windows 11 — usbipd-win + per-machine agent."

  - name: "Workstation"
    host: "workstation.local"
    os: windows
    notes: "Windows workstation — usbipd-win."

  - name: "Linux box"
    host: "192.168.1.51"
    os: linux
    notes: "Linux — usbip exporter."
