# Netwerk-USB (USB/IP) — exporter-hosts
# ======================================
# Machines waaraan je een archiefschijf kunt hangen om hem via USB/IP door te
# geven aan de server (.195, de importer). De app leest deze lijst voor het
# "Netwerk-USB"-paneel.
#
# Velden per host:
#   name  : weergavenaam in de UI
#   host  : adres dat 'usbip attach -r <host>' gebruikt (IP of hostname/Tailscale-naam)
#   os    : windows | linux  (bepaalt welke exporter-instructie de UI toont)
#   notes : vrije toelichting
#
# Zie network-usb/README.md voor het instellen van de exporter per machinetype.
# De NAS (.249) ontbreekt bewust: DSM mist de usbip-kernelmodules — zie
# docs/MANTIS-NAS-USBIP-KANAAL.md.

hosts:
  - name: "Desktop (<jouw-machine>)"
    host: "<jouw-machine-ip>"
    os: windows
    notes: "Windows 11 — usbipd-win + archief-agent. Hoofd-werkplek. (DHCP: was .125)"

  - name: "<werkstation>"
    host: "<werkstation-ip>"
    os: windows
    notes: "Windows-werkstation — usbipd-win."

  - name: "<andere-machine>"
    host: "<andere-machine-ip>"
    os: linux
    notes: "<andere-machine> (user <gebruiker>). OS verifiëren; bij Linux usbip-exporter, bij Windows usbipd-win."
